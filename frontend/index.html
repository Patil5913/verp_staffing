<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="{{ app_logo }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0057e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{ app_name }}" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/verp-manifest.webmanifest" />
    <link rel="apple-touch-icon" href="{{ app_logo }}" />
    <title>{{ app_name }}</title>
    <script>
      // Set data-theme before first paint so there's no flash of the wrong
      // theme. Kept in sync at runtime by src/composables/common/useTheme.js.
      ;(function () {
        try {
          var stored = localStorage.getItem('verp-theme')
          var pref = ['system', 'light', 'dark'].indexOf(stored) > -1 ? stored : 'system'
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref
          document.documentElement.setAttribute('data-theme', resolved)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
